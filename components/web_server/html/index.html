<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ESP32 Terminal</title>
<script src="/xterm.js"></script>
<link rel="stylesheet" href="/xterm.css">
<link rel="stylesheet" href="/style.css">
<script src="/script.js" defer></script>
</head>
<body>

<div class="topbar">
    <div class="topbar-title">
        ESP32 TERMINAL
        <span id="esp-app-ver" class="app-ver" title="Версия прошивки ESP">v—</span>
    </div>
    <div class="status">
        <div id="dot" class="dot"></div>
        <div id="status">Disconnected</div>
    </div>
</div>

<div class="tabs">
    <button class="tab active" onclick="showTab('terminal')">Терминал</button>
    <button class="tab" onclick="showTab('downloads')">Чтение архива</button>
    <button class="tab" onclick="showTab('firmware')">Перепрошивка</button>
</div>

<!-- Страница терминала -->
<div id="terminal-page" class="page active">
    <div class="terminal-layout">
        <!-- Экран терминала (формат вывода xterm не меняется) -->
        <div class="terminal-main">
            <div id="terminal-container"></div>
        </div>

        <!-- Управление: портрет — снизу; ландшафт — справа -->
        <div class="controls-rail">
            <div class="state-panel">
                <div class="state-item">
                    <div id="led-stop" class="state-led"></div>
                    <span>СТОП</span>
                </div>
                <div class="state-item">
                    <div id="led-wait" class="state-led"></div>
                    <span>ОЖИДАНИЕ</span>
                </div>
                <div class="state-item">
                    <div id="led-run" class="state-led"></div>
                    <span>РАБОТА</span>
                </div>
            </div>

            <div class="btn-grid">
                <!-- ряд 1: START | STOP -->
                <button type="button" class="btn-start" onclick="sendKey('start')">START</button>
                <button type="button" class="btn-stop" onclick="sendKey('stop')">STOP</button>
                <!-- ряд 2: F1 F2 F3 -->
                <button type="button" class="btn-f" onclick="sendKey('f1')">F1</button>
                <button type="button" class="btn-f" onclick="sendKey('f2')">F2</button>
                <button type="button" class="btn-f" onclick="sendKey('f3')">F3</button>
                <!-- ряд 3–4: навигация -->
                <button type="button" onclick="sendKey('enter')">ENTER</button>
                <button type="button" onclick="sendKey('up')">▲</button>
                <button type="button" onclick="sendKey('esc')">ESC</button>
                <button type="button" onclick="sendKey('left')">◄</button>
                <button type="button" onclick="sendKey('down')">▼</button>
                <button type="button" onclick="sendKey('right')">►</button>
            </div>
        </div>
    </div>
</div>

<!-- Страница загрузок (увеличенная) -->
<div id="downloads-page" class="page">
    <div class="download-panel">
        <div class="download-row">
            <label>Размер архива:</label>
            <span id="archive-size" class="value">—</span>
        </div>

        <div class="download-actions">
            <button id="btn-download" class="btn-start-download" onclick="startDownload()">Скачать архив</button>
            <button id="btn-stop" class="btn-stop-download" onclick="stopDownload()" disabled>Остановить</button>
        </div>

        <div class="progress-container">
            <div id="progress-bar" class="progress-bar" style="width:0%;"></div>
            <div id="progress-text" class="progress-text">0%</div>
        </div>

        <div class="download-info">
            <span class="label">Получено:</span>
            <span class="value" id="received-bytes">0 байт</span>
            <span class="label">Всего:</span>
            <span class="value" id="total-bytes">0 байт</span>
            <span class="label">Осталось:</span>
            <span class="value" id="eta">—</span>
            <span class="label">Прошло:</span>
            <span class="value" id="elapsed">00:00</span>
            <span class="label">Скорость:</span>
            <span class="value" id="speed">0 байт/с</span>
        </div>
    </div>
</div>


<!-- Страница перепрошивки -->
<div id="firmware-page" class="page">
    <div class="download-panel firmware-panel">
        <div class="download-row">
            <label>Устройство:</label>
            <select id="fw-target" class="fw-target-select" onchange="onFwTargetChange()">
                <option value="ksu" selected>КСУ</option>
                <option value="esp">ESP32</option>
            </select>
        </div>

        <div class="download-row" id="fw-version-row">
            <label>Версия прошивки:</label>
            <span id="fw-version" class="value">—</span>
            <button type="button" id="btn-fw-refresh-ver" class="btn-secondary" onclick="requestFirmwareVersion()">Обновить</button>
        </div>

        <div class="download-row fw-file-row">
            <label id="fw-file-label">Файл прошивки (.ubt):</label>
            <input type="file" id="fw-file-input" accept=".ubt,application/octet-stream" hidden />
            <button type="button" id="btn-fw-choose" class="btn-secondary" onclick="document.getElementById('fw-file-input').click()">Выбрать файл</button>
        </div>

        <div class="download-row">
            <label>Имя файла:</label>
            <span id="fw-file-name" class="value">—</span>
        </div>

        <div class="download-row">
            <label>Размер файла:</label>
            <span id="fw-file-size" class="value">—</span>
        </div>

        <div class="download-actions">
            <button id="btn-fw-upload" class="btn-start-download" onclick="uploadFirmware()" disabled>Отправить файл</button>
            <button id="btn-fw-reflash" class="btn-reflash" onclick="startReflash()" disabled>Команда на перепрошивку</button>
        </div>

        <div class="progress-container fw-progress-container" id="fw-progress-wrap">
            <div id="fw-progress-bar" class="progress-bar" style="width:0%;"></div>
            <div id="fw-progress-text" class="progress-text">0%</div>
        </div>

        <div class="download-info">
            <span class="label">Прогресс:</span>
            <span class="value" id="fw-progress-pct">0%</span>
            <span class="label">Статус:</span>
            <span class="value" id="fw-status">ожидание</span>
        </div>
    </div>
</div>

</body>
</html>
